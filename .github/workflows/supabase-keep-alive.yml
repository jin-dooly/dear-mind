# Supabase 무료 플랜은 7일 동안 활동이 없으면 프로젝트를 일시정지해요.
# 3일마다 DB에 가벼운 조회 요청을 보내 일시정지를 막아요.
# RLS 때문에 결과는 빈 배열이지만, 요청이 DB까지 도달하므로 활동으로 기록돼요.
#
# 필요한 저장소 Secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL              예: https://xxxx.supabase.co
#   SUPABASE_PUBLISHABLE_KEY  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY와 같은 값
name: Supabase keep-alive

on:
  schedule:
    - cron: "0 0 */3 * *" # 3일마다 09:00 KST
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY secret이 설정되지 않았어요"
            exit 1
          fi
          status=$(curl -sS -o response.json -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/questions?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")
          echo "HTTP $status"
          cat response.json; echo
          if [ "$status" -ne 200 ]; then
            echo "::error::Supabase 응답이 200이 아니에요 (프로젝트가 일시정지됐을 수 있어요)"
            exit 1
          fi
